apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-alert-data
  namespace: platform
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: data-processing-platform
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
