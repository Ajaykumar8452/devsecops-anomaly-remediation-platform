services:
  backend:
    image: devsecops-anomaly-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      ALERT_DATABASE_PATH: /app/data/alerts.db
      ALERT_DATABASE_SEED_PATH: /app/seed-data/alerts.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - alert_data:/app/data
      - ./data:/app/seed-data:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=4)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  dashboard:
    image: devsecops-anomaly-dashboard:local
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      ANOMALY_DASHBOARD_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8501:8501"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  alert_data:
